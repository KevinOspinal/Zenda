# Servicios de desarrollo. `api` y `worker` se agregan en fases posteriores.
name: zenda

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Credenciales solo para desarrollo local; en despliegue vienen de secretos.
      POSTGRES_USER: ${POSTGRES_USER:-zenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenda}
      POSTGRES_DB: ${POSTGRES_DB:-zenda}
      # Usuario sin privilegios con el que se conecta la app (ver docker/postgres).
      APP_DB_USER: ${APP_DB_USER:-zenda_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-zenda_app}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts que PostgreSQL ejecuta al crear la base por primera vez.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
